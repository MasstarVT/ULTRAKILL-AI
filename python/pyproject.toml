[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrakill-ai"
version = "0.1.0"
description = "Reinforcement learning agent for ULTRAKILL, driven through the UltrakillAIBridge BepInEx mod"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "tensorboard>=2.16",
    "pyyaml>=6.0",
]
# PyTorch is installed separately so you get the CUDA build, see README.

[tool.setuptools.packages.find]
include = ["ultrakill_ai*"]

# The room-trunk route files (layer 2 of the route signal) are DATA inside the package, and `routes/` is not
# itself a package, so a non-editable install would drop all twelve and silently take twelve levels back to the
# exit vector. Every machine here uses `pip install -e .`, where this is moot; it is declared so a wheel built
# somewhere else cannot lose them without anything failing.
[tool.setuptools.package-data]
ultrakill_ai = ["routes/*.json"]
