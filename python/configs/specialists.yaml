# ONE SPECIALIST POLICY PER LEVEL, trained sequentially. The plan file for scripts/campaign_driver.py.
#
# WHY. Measured on the live `campaign_gates` run over the twelve hours to 2026-09-18: one shared policy on a
# multi-level mixture THRASHES. Whichever level receives the fresh-start share improves while the others
# regress -- Level 0-1's fresh completion rate went 0.65 -> 0.13 -> 0.36 as the draws moved, and Level 0-3 fell
# from 7.3 gates reached to 3.6 as soon as its share was damped. Learning-progress weighting moved WHICH level
# is starved; it did not stop the starving, because one set of weights cannot hold twelve levels' worth of
# route at once. The lead's decision: train one specialist per level, sequentially, all twelve games on the
# current level, each specialist initialised from the previous level's best (the first from the current shared
# policy), and chain the specialists for a full-game run -- one policy per level.
#
# NOTHING ELSE CHANGES. No observation, action or reward semantics move. Each stage is exactly the existing
# SINGLE-LEVEL env mode (`level:`, no `levels:` list), which is the mode `configs/campaign_0-1.yaml` has always
# used, so a specialist is a checkpoint of the same shape as every campaign checkpoint since the look modes.
#
# THIS FILE IS A PLAN, NOT A TRAINING CONFIG. `campaign_driver.py` reads it and writes one real config per
# stage to `configs/generated/spec_<level>.yaml` (run name `spec_<level>`, its own `timesteps` budget). Do not
# pass this file to train.py.
#
#   python scripts/campaign_driver.py --start-at "Level 0-1" --init models/campaign_gates/best.zip --monitor 1
#   python scripts/campaign_driver.py          # EVERY restart after the first: no flags, the state file decides
#   New-Item runs/specialists/DRIVER_PAUSE      # from python/: the driver then does nothing at all
#   python scripts/specialists_status.py        # stage, steps into it, rate, the finished specialists
#   python scripts/full_run.py                  # chain the specialists over one game, post the times
#
# `env:` and `train:` below are configs/campaign_gates_full.yaml's, minus the multi-level keys (`levels`,
# `unlock_rate`, `unlock_window`, `unlock_after_fresh_episodes`, `level_weight_floor`, `curriculum_weighting`)
# and minus the per-stage keys (`run_name`, `timesteps`). `tests/test_specialists_config.py` pins EVERY other
# setting, reward weight and hyperparameter equal to that config, so a specialist run cannot silently drift
# away from the policy it is initialised from.
# STAGE KINDS (2026-09-18, docs/superpowers/specs/2026-09-18-speed-stages.md). An entry is either a bare level
# name -- a `complete` stage, the rule this file has always carried -- or `{level: ..., kind: speed}`, which
# re-runs a level that is already being finished with `level_complete` scaled by the clock and will not promote
# until the level is finished FAST. The lead's instruction on 2026-09-18: nothing promotes to 0-4 until 0-1,
# 0-2 and 0-3 have better times, because they can be done much faster than they are being done.
order:  # the 30 levels of configs/campaign_gates_full.yaml, mission order (read that file's header for why
        # exactly these), with each of the first three levels' SPEED stage directly after its own complete
        # stage. LEVEL-MAJOR, 2026-09-19, on the user's instruction -- "shouldnt we just work on 0-1 untell
        # its finished before working on the other levels" -- because `hold_order: sequential` below walks
        # this list in order, so the list IS the depth-first order: 0-1 finished (complete, then speed)
        # before anything of 0-2 starts. `Plan.order` -- the distinct levels, which is what full_run.py
        # plays -- is unchanged by the reordering.
  - "Level 0-1"
  - {level: "Level 0-1", kind: speed}
  - "Level 0-2"
  - {level: "Level 0-2", kind: speed}
  - "Level 0-3"
  - {level: "Level 0-3", kind: speed}
  - "Level 0-4"
  - "Level 0-5"
  - "Level 1-1"
  - "Level 1-2"
  - "Level 1-4"
  - "Level 2-1"
  - "Level 2-2"
  - "Level 2-3"
  - "Level 2-4"
  - "Level 3-1"
  - "Level 3-2"
  - "Level 4-1"
  - "Level 4-2"
  - "Level 4-3"
  - "Level 4-4"
  - "Level 5-1"
  - "Level 5-2"
  - "Level 5-3"
  - "Level 6-1"
  - "Level 7-1"
  - "Level 7-2"
  - "Level 7-3"
  - "Level 7-4"
  - "Level 8-1"
  - "Level 8-2"
  - "Level 8-3"
  - "Level 8-4"
stage:
  # THE STAGE RULE. A stage ends when BOTH of these hold:
  #   - the level's fresh completion rate over its last 50 fresh episodes is >= `target_rate`, over at least
  #     `min_fresh_window` of them (the rate is latched once reached: a later dip does not un-reach it, because
  #     keep_best.py is holding the peak in best.zip and that peak is what gets promoted);
  #   - and `settle_steps` have passed since the LATER of that moment and the last time keep_best.py moved
  #     best.zip. That second clause is the whole point of the settle: a run that is still setting new bests
  #     keeps resetting its own clock and keeps training, and the stage only ends once the peak stops moving.
  # OR the stage has consumed `max_steps_per_stage`, at which point it moves on regardless and is recorded as
  # "unfinished" so it can be revisited. `campaign_driver.stage_verdict` is that rule, and it is pure.
  target_rate: 0.5
  min_fresh_window: 30
  settle_steps: 300000
  max_steps_per_stage: 6000000
  # Only ever reached while the HOLD LINE is up: the ladder itself runs each stage exactly once and walks past
  # an "unfinished" one. 0 means NO CAP; see the same key under `speed:` below for why it is 0.
  max_rounds: 0
  count: 12        # game instances; hidden from Steam unless --steam
  monitor: 1       # the one-display PC
  # Each stage starts with the shared run's exploration archives for ITS level copied into the stage's model
  # directory, when they exist. Their floor counts carry the 1/sqrt(N) decay that makes the agent push outward
  # at all, and a stage that starts without them restarts exploration from nothing.
  seed_explore_from: campaign_gates
speed:
  # A SPEED STAGE's rule: everything not named here falls back to `stage:` above. It ends when the fresh
  # completion rate reaches `target_rate` over `min_fresh_window` fresh episodes AND the best official time is
  # at or under the level's own S-rank time -- both latched together, then the same settle. The rate bar is
  # lower than a complete stage's because a fast policy that finishes four loads in ten is worth more to the
  # ladder than a slow one that finishes six, and the step cap is higher because the clock is a harder target
  # than the first completion was.
  target_rate: 0.4
  min_fresh_window: 30
  settle_steps: 300000
  max_steps_per_stage: 8000000
  # HOW MANY ROUNDS the hold line may spend on one stage. 0 = UNBOUNDED, and that is the lead's decision of
  # 2026-09-18: NEVER IDLE THE MACHINE. A cap makes the driver exit "HELD" (code 1) once every stage in front
  # of the line has spent its rounds, and nobody watches this run -- there are no LLM monitors, by the user's
  # own instruction -- so that exit is hours or days of twelve idle games, which is strictly worse than
  # carrying on training the held stages. The held stages therefore keep getting fresh budgets (in the
  # `hold_order` below) until the targets are met or a human lifts the hold line. To stop instead of
  # continuing, set a positive number here.
  # If a target turns out to be unreachable, retune `target_scale` or add a per-level `targets:` override
  # above, or lift `hold_before`; every round's weights stay in models/spec_<level>_speed/.
  max_rounds: 0
  # THE TARGET TIME IS NEVER HAND-PICKED. It is the level's own S-rank time threshold
  # (`campaign.ranks.time[-1]`), which the env reads live at the first observation of the stage and reports
  # through status.json. A level may be overridden here -- `"Level 0-1": 95.0` -- and the env then reports THAT
  # number down the same path, so the reward and the promotion rule always agree. Empty: read every level's own.
  targets: {}
  # ... TIMES THIS (spec §8b). 0.75 was chosen while the gate was the run's LIFETIME BEST, which 0-2's one
  # lucky 139.5 s load already S-ranked -- a bare S target would have promoted that stage on its first
  # observation. The gate is now the MEDIAN of the last 50 fresh completions (2026-09-18 review), and against
  # the median the level's own S-rank time is already a demanding, objective target: spec_0-1's median is
  # 482 s against an S of 120 s, spec_0-2's is 236 s. So the bar at scale 1.0 is "the TYPICAL run S-ranks the
  # clock". Pressure does not stop at the gate either: the reward keeps scaling up to 2x for a completion at
  # half the target, and the settle rule keeps a stage training while keep_best is still moving best.zip.
  # Applied in exactly ONE place -- the env -- so the reward and the promotion rule cannot drift apart; a
  # `targets:` override above is a decision already made and is NOT scaled.
  target_scale: 1.0
  # A SPEED STAGE'S OWN REWARD WEIGHTS (2026-09-20). Merged over the shared `env.rewards:` block above for a
  # speed stage and for nothing else, so a complete stage's generated config is byte-identical to what it was
  # and configs/campaign_gates_full.yaml stays the pin for it. Full derivation, the measurements and the
  # revert trigger: docs/project-log.md, 2026-09-20.
  #
  # WHY `death` MOVES. On 0-2's speed stage the clock is deaths and nothing else: over 2,067 live fresh
  # completions `seconds = 121.33 + 22.32 * deaths` (r +0.86) and a completed run averages 4.75 of them. The
  # objective cost of one death is 14.27 -- 6.99 of `time` over the 349.6 extra decisions it adds, plus 7.28
  # of `level_complete` the slower clock gives up. The policy does not feel that. At the death decision it is
  # paid `death` 5.0 + `damage_taken` 1.0, the time stream discounts to 5.02 at gamma 0.998, the completion
  # bonus arrives ~1,484 decisions later at 0.998^1484 = 0.051 of face value (0.37), and -- measured over the
  # 126 recorded deaths in runs/probe_0-2_speed -- a respawn RE-PAYS +6.17 of combat reward, because the
  # game's kill counter rolls back to the checkpoint value, the arena resurrects and `new_kills` pays for
  # every re-kill again (133 rollbacks; 2,434 paid kill events against 1,126 final kills). Net felt cost of a
  # death: about -6.5 against an objective -14.27. Setting the felt cost equal to the objective one gives
  # 12.7; pricing the MARGINAL death (18.52) would give 17.0. 12.0 is the conservative end of that range and
  # buys most of the effect for half the added return variance.
  #
  # THE LEVER IS CROSSINGS, NOT CAUTION. >= 96% of deaths are full-hp instant kills by crusher pistons whose
  # DeathZones are triggers -- every observation ray passes QueryTriggerInteraction.Ignore, there is no hazard
  # channel in the 479 floats and no frame stack, so a timed dodge is not learnable at ANY weight. What is
  # learnable is fewer passes: expected deaths = 0.115 x crusher-footprint crossings, and the 86.74 s best run
  # makes 19 crossings where the median run makes 46, at an identical exposure FRACTION. Waiting cannot lower
  # p(death | crossing) and costs 0.313 per official second, so the gradient this buys points at "go through
  # once", not at "stand still". Pinned by tests/test_speed_death_weight.py.
  rewards:
    death: 12.0
# THE FOCUS / RECORD CHASE (spec §11). The user, 2026-09-20: "can we focuse on one level tell we get it to a
# point that is close to the speed run record". While this block is set the driver trains NOTHING ELSE: not
# 0-2, not 0-3, not 0-4, whatever `order:`, `hold_before:` and `hold_order:` above would otherwise say. It runs
# the named level's SPEED stage over and over, one RUNG of `targets:` at a time, each rung an explicit median
# in official seconds -- never the S-rank time, never scaled by `target_scale` above.
#
# WHY LEVEL 0-1. It is the first level, it has the most trained brain in the project (28.39M cumulative steps),
# and it is the only level whose speed stage has ever passed: on 2026-09-19 it met its S-rank rung with
# median_time_50 147.16 s against a 150 s target at a 0.92 fresh rate, best single run 81.46 s. The human
# INBOUNDS individual-level record is 19.798 s (configs/il_records.yaml, docs/il-records.md; the 4.915 s Any%
# leaves the level and is not a target a campaign policy can reach). So the AI's median is 7.4x the record and
# its best is 4.1x it -- which is what this ladder exists to close.
#
# THE LADDER. Each rung is a target the policy has to make TYPICAL, not once: the promotion rule is the speed
# rule unchanged, fresh rate >= 0.4 AND median_time_50 <= the rung. The steps are ~15-20% apart at the top,
# where the loss is route length rather than execution, and tighten toward the bottom; the last rung, 25 s, is
# about 1.26x the record, which is "close to the speed run record" without pretending a memoryless MLP with no
# hazard channel will beat a human. A rung that is already met is SKIPPED (see `focus_rung`), so the 150 s
# round already recorded puts the focus straight on 120. A round that runs out of steps repeats its own rung,
# unbounded, because `speed.max_rounds` above is 0. When the last rung is done the focus stops, says so, and
# the ordinary plan takes over -- it does NOT silently keep training.
#
# TO STOP THE FOCUS: delete this block, or set `focus: null`. The driver then behaves exactly as it did before
# it existed, from the same state file.
focus:
  level: "Level 0-1"
  targets: [120, 100, 85, 72, 60, 50, 42, 35, 30, 25]
# THE HOLD LINE (spec §8a). No stage at or after this level starts until EVERY stage before it is "done".
# The lead, 2026-09-18: "dont have it promote to 0-4 untell it gets better times on these levels". Without this
# key a speed stage that burns its 8M-step cap is recorded "unfinished" and the ladder walks on to 0-4 carrying
# exactly the slow policies the instruction forbids. While the line is up the driver keeps training the stages
# in front of it, each round a fresh step budget resumed from that stage's own newest weights. Set it to null
# (or delete it) to let the ladder walk on.
hold_before: "Level 0-4"
# WHICH held stage runs next (spec §10). The user, 2026-09-19: "shouldnt we just work on 0-1 untell its
# finished before working on the other levels". `sequential` is that, exactly: the FIRST not-done stage of the
# `order:` list above that can start runs, round after round, until its own rule says "done"; only then does
# the next one start. With the level-major order above that means 0-1 complete -> 0-1 speed -> 0-2 complete ->
# 0-2 speed -> 0-3 complete -> 0-3 speed, and then the line opens and 0-4 begins. The alternative,
# `round_robin` (the rule the hold line shipped with on 2026-09-18, and still the code's default so that
# nothing written before this key changes meaning), gave every not-done stage a fresh budget before any of
# them got a second -- which spread the machine across three levels at once. A stage that cannot start at all
# (a speed stage whose complete stage is not done) is passed over, with the reason logged.
hold_order: sequential
env:
  mode: campaign
  level: "Level 0-1"   # the driver overwrites this per stage; `levels` is deliberately absent
  difficulty: 3
  unlock_all_gear: true
  fixed_fps: 30
  frameskip: 2
  render: false
  soft_death: false
  window_width: 368
  window_height: 207
  max_steps: 12000
  fresh_start_prob: 0.2
  stuck_seconds: 45
  stuck_repeats: 3
  cell_size: 4.0
  pitch_limit_deg: 45.0
  gate_patience_mode: collapsed
  prefer_route_when_collapsed: true
  rewards: {time: 0.02, level_complete: 100.0, checkpoint: 10.0, arena_clear: 10.0, door_unlock: 15.0,
            gate: 15.0, gate_approach: 0.15, novelty: 0.2, path: 0.0, kill: 0.5, damage_dealt: 0.5,
            damage_taken: 0.01, death: 5.0, style: 0.0, punch: 0.01,
            item_pickup: 10.0, item_placed: 20.0}
train:
  algo: ppo
  num_envs: 12
  save_every: 50000
  policy_kwargs: {net_arch: [512, 512]}
  hyperparams: {learning_rate: 0.0002, n_steps: 2048, batch_size: 512, n_epochs: 5, gamma: 0.998,
                gae_lambda: 0.95, ent_coef: 0.004, target_kl: 0.03}
  ent_floor: 6.5
  ent_coef_max: 0.02
