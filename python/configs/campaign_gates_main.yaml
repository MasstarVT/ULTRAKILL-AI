# The live `campaign_gates` run continuing across the whole usable campaign: same run name, same
# models/campaign_gates/, same weights, same policy. It replaces configs/campaign_gates_prelude.yaml, which
# stays in the repo as the history of what the 4.8M -> 6.8M stretch ran on. Written for the 2026-09-17
# integration pause #2, which merged `skull-fixes` (mod v0.7.1) onto main.
#
# Judge this run PER LEVEL, on the dashboard's `levels` rows and status.json's `campaign.levels` table, never on
# the pooled `fresh_completion_rate`: that is a shrunk SUM over the unlocked levels, a score rather than a rate,
# and it can exceed 1.0. `max_steps` is one value for every level, so a longer level is truncated by
# construction and its rate is not comparable with 0-1's.
#
# FOUR CHANGES from campaign_gates_prelude.yaml, plus num_envs, and nothing else. A test
# (test_campaign_config.test_the_main_config_carries_the_gates_prelude_run_forward) pins every other env
# setting, every other reward weight and every hyperparameter equal to the prelude config, so nothing can drift
# in here by accident.
#
# 1. `levels`: 11 instead of 3, in mission order. These are exactly the level survey's Tier A and Tier B
#    (docs/level-survey.md §6) among the levels before the first boss wall -- the ones with a walkable gate
#    ladder and no mechanic nobody has built. Tier A (0-1, 0-3, 0-4, 2-1, 2-2, 3-1, 4-1) needs no new code at
#    all. Tier B (0-2, 1-1, 1-2, 2-3) needs the skull carry, which was verified end to end in game on 1-1 at
#    this pause: pickup, placement, the door opening, and the carry surviving a death. Tier C is boss-gated,
#    Tier D has no usable route source and Tier E needs trams or swimming; none of them are here.
#    Unlocking is chained, so in practice this is the prelude run continuing with a much longer ladder in front
#    of it. 0-1 and 0-3 were already unlocked when the order changed and STAY unlocked: `unlocked` is latched
#    per level by name, never recomputed from position, so inserting 0-2 between them re-locks nothing
#    (test_inserting_a_level_before_an_unlocked_one_keeps_it_unlocked). 0-2 then unlocks on 0-1's own rate.
#
# 2. `unlock_after_fresh_episodes: 600` -- the new curriculum SAFETY VALVE, 0 (off) everywhere else. A level
#    also opens its successor once it has spent 600 of its own CUMULATIVE fresh episodes, whatever its
#    completion rate. The ladder is strictly chained, so without it one level the policy cannot crack blocks
#    every level behind it for the rest of the run, and nothing in the metrics distinguishes "needs 2M more
#    steps" from "needs a mechanic that does not exist yet". 600 is roughly 3-5 M steps at 0-1's episode
#    lengths -- far more than the ~200 fresh episodes 0-1 needed to go from 0.00 to 0.54 -- so it can only fire
#    on a level that is genuinely stuck. Cumulative, not windowed: `fresh_window` saturates at 50. It is
#    carried across restarts with `episodes`, or a run stopped every few hours could never reach it.
#
# 3. `max_steps` 9000 -> 12000. Measured, not guessed: of the last 100 fresh episodes before the pause, 24
#    ended at the 9000 cap holding 7-10 of 10 gates, while the episodes that actually completed took a median
#    6854 decisions and the first two fresh completions averaged 7967 -- 88% of the cap. Deep runs were losing
#    to the clock, not to the level. This is not a reward change: a `max_steps` end is a TRUNCATION, so SB3
#    bootstraps `gamma * V(s_T)` and the agent is not paid for the extra time; it just stops having the answer
#    cut off. `stuck_seconds` is deliberately untouched at 45, so a genuinely stuck episode still ends early
#    and the extra cap costs nothing on the 38-in-100 cohort that dies in the first gun room.
#
# 4. `item_pickup: 10.0` and `item_placed: 20.0`, up from 0.0. They were held at zero until the skull carry
#    was proven in game, which it now is (spec §8 checks 1-3 all PASS on 1-1 with rendering off, and the M14
#    dead-twin bug that kept `needs_item` set after a real placement is fixed in mod v0.7.1 and verified:
#    `gate 20,-10,381 needs_item=None open=True` once the altar reads filled). Arithmetic: `time` is 0.02 per
#    decision at 15 decisions/s = 0.3 per game second, so 1-1's red leg (~190 m, 24-48 s) costs 7.2-14.4. The
#    30 total clears that with margin, is 30% of `level_complete`, and sits next to `checkpoint` and
#    `arena_clear` at 10. The terminal event is weighted higher so collect-and-abandon is not worth it alone.
#    Neither goes above `gate` (15), or fetching a skull the route does NOT need -- 0-2 ships exactly one, at
#    an off-ladder secret altar -- becomes attractive. Not farmable: `MilestoneTracker` pays each once per
#    level load, pinned by test_a_placement_pays_once_even_when_the_skull_is_pulled_back_out. Note
#    `door_unlock` does not fire for an altar door (`ItemPlaceZone.CheckItem` calls `Door.Open()`, not
#    `Unlock()`), so `gate` is the only other term the leg earns.
#    Read `part_item_pickup` / `part_item_placed` against `part_gate` in metrics_log.csv for the first 400k
#    steps before touching either again.
#
# UNCHANGED and deliberately so: `ent_coef` stays 0.004. Entropy was 7.7 total and descending ~1.0 nat per
# 300k steps at the pause; the tripwire is unchanged at **total entropy below 6.0** -- stop and raise ent_coef
# to 0.006-0.008. keep_best.py --metric campaign guards the weights meanwhile.
#
# num_envs is 12 (ports 47800-47811), up from 8, which needs `[Logging.Disk] Enabled = false` in
# <game>/BepInEx/config/BepInEx.cfg. Measured at this pause on the real resume checkpoint, steady state after
# the first rollout: 8 games 188.6 steps/s, 10 games 220.5 (+16.9%), 12 games 236.5 (+25.4%). Zero bridge
# timeouts and zero lost instances in all three legs, and SubprocVecEnv steps in lockstep, so the aggregate
# rate IS the per-game responsiveness measure -- one slow game would drag the whole vector down. 12 copies hold
# 9.6 GB of a 31.9 GB machine with 24 logical cores. To undo, set this back to 8; nothing else changes.
#
# From python/ (one display, so --monitor 1 everywhere):
#   python scripts/games.py launch --count 12 --monitor 1
#   python scripts/train.py --config configs/campaign_gates_main.yaml --resume models/campaign_gates/latest.zip
#   python scripts/poll_status.py --run campaign_gates
#   python scripts/keep_best.py --run campaign_gates --metric campaign
#   python scripts/dashboard.py --run campaign_gates --monitor 1
#   python scripts/games.py stop
env:
  mode: campaign
  levels: ["Level 0-1", "Level 0-2", "Level 0-3", "Level 0-4", "Level 1-1", "Level 1-2",
           "Level 2-1", "Level 2-2", "Level 2-3", "Level 3-1", "Level 4-1"]
  unlock_rate: 0.5
  unlock_window: 20
  unlock_after_fresh_episodes: 600
  level_weight_floor: 0.1
  difficulty: 3
  unlock_all_gear: true
  fixed_fps: 30
  frameskip: 2
  render: false
  soft_death: false
  window_width: 368
  window_height: 207
  max_steps: 12000
  fresh_start_prob: 0.2
  stuck_seconds: 45
  stuck_repeats: 3
  cell_size: 4.0
  pitch_limit_deg: 45.0
  # configs/campaign_gates_prelude.yaml's weights, plus the two skull terms. A test pins every other one equal,
  # so no weight can change here by accident while the same policy continues.
  rewards: {time: 0.02, level_complete: 100.0, checkpoint: 10.0, arena_clear: 10.0, door_unlock: 15.0,
            gate: 15.0, gate_approach: 0.15, novelty: 0.2, path: 0.0, kill: 0.5, damage_dealt: 0.5,
            damage_taken: 0.01, death: 5.0, style: 0.0, punch: 0.01,
            item_pickup: 10.0, item_placed: 20.0}
train:
  algo: ppo
  num_envs: 12
  run_name: campaign_gates
  timesteps: 20000000
  save_every: 50000
  policy_kwargs: {net_arch: [512, 512]}
  hyperparams: {learning_rate: 0.0002, n_steps: 2048, batch_size: 512, n_epochs: 5, gamma: 0.998,
                gae_lambda: 0.95, ent_coef: 0.004, target_kl: 0.03}
