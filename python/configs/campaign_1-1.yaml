# Campaign level 1-1, the first level whose route is held shut by a skull carry. Everything is copied from
# campaign_0-1.yaml except the level, the run name and the three settings below.
#
# **item_pickup and item_placed ship at 0.0 and must stay there until the three in-game checks of
# docs/superpowers/specs/2026-09-17-multi-level-and-skull-gates-design.md §8 pass**, in this order:
#   1. a punch at the red pedestal (81.0, -2.2, 275.0) makes that items[] entry read held: true WITH
#      rendering off. Punch.ActiveFrame only runs from ActiveStart, which is a Unity AnimationEvent and has no
#      C# caller anywhere in the decompiled game, so if the fist Animator is culled under render: false the
#      whole mechanism is inert and nothing else in S4 matters;
#   2. carrying it to (0.0, -6.76, 381.0) and punching makes that altar read filled: true and gate 20,-10,381
#      read needs_item: null, and both still hold after 100 further steps of punch spam;
#   3. what a death does to a held skull -- the one thing that cannot be settled offline.
# Only then raise both to 15.0, the tier of `gate` and `door_unlock`: at 0.15/m the red leg's 133.5 m out and
# back pays about +40 of approach, so the milestones have to be worth the detour and the ~5 s of `time` it costs.
# Until then this config trains 1-1's ordinary route and simply cannot pass the two skull-locked gates.
#
# subgoal_punch_range_m is Punch.ActiveFrame's own 4 m reach. Inside it of a sub-goal the env takes the camera
# (look mode 2 at the game's own pitch clamp, not the 45 degree band, or a floor-level altar cube a metre away
# sits under the ray) and outside it drops `punch` whenever anything is held: an unprotected carry is thrown
# within a fraction of a second at the policy's measured ~5 presses a second, and a punch at an altar that is
# already filled pulls the skull back out and closes the door it opened.
#
# From python/ (on a one-display PC add --monitor 1 to games.py and dashboard.py):
#   python scripts/games.py launch --count 5
#   python scripts/train.py --config configs/campaign_1-1.yaml --resume models/campaign_gates/best.zip
#   python scripts/poll_status.py --run campaign_1-1
#   python scripts/keep_best.py --run campaign_1-1 --metric campaign
#   python scripts/dashboard.py --run campaign_1-1
#   python scripts/games.py stop
# Copy models/campaign_gates/explore_*.npz into models/campaign_1-1/ first only if you want 0-1's counts; 1-1
# is a different level, so its archive starts empty either way (explore_* files are keyed by level name).
env:
  mode: campaign
  level: "Level 1-1"
  difficulty: 3
  unlock_all_gear: true
  fixed_fps: 30
  frameskip: 2
  render: false
  soft_death: false
  window_width: 368
  window_height: 207
  max_steps: 9000
  fresh_start_prob: 0.2
  stuck_seconds: 45
  stuck_repeats: 3
  cell_size: 4.0
  pitch_limit_deg: 45.0
  subgoal_punch_range_m: 4.0
  rewards: {time: 0.02, level_complete: 100.0, checkpoint: 10.0, arena_clear: 10.0, door_unlock: 15.0,
            gate: 15.0, gate_approach: 0.15, novelty: 0.2, path: 0.0, kill: 0.5, damage_dealt: 0.5,
            damage_taken: 0.01, death: 5.0, style: 0.0, punch: 0.01,
            item_pickup: 0.0, item_placed: 0.0}
train:
  algo: ppo
  num_envs: 5
  run_name: campaign_1-1
  timesteps: 20000000
  save_every: 50000
  policy_kwargs: {net_arch: [512, 512]}
  hyperparams: {learning_rate: 0.0002, n_steps: 2048, batch_size: 512, n_epochs: 5, gamma: 0.998,
                gae_lambda: 0.95, ent_coef: 0.01, target_kl: 0.03}
