# Human individual-level (IL) speedrun records for ULTRAKILL, in seconds of in-game time.
#
# RESEARCH ARTIFACT FOR TARGET-SETTING ONLY. Nothing in the training pipeline reads this file: it is not an
# EnvConfig, it is not loaded by train.py or eval.py, and no reward term references it. It exists so a human
# comparing times.md against what people actually achieve has the numbers in one machine-readable place.
#
# Source:   speedrun.com REST API, https://www.speedrun.com/api/v1, game id 369p3p81
# Fetched:  2026-09-18
# Timing:   in-game time (IGT) on every entry. IL runs carry no real-time value on these boards.
# Prose:    docs/il-records.md (runners, dates, run links, and the out-of-bounds analysis)
#
# DIFFICULTY IS NOT RECORDED BY THE BOARDS. No ULTRAKILL leaderboard has a difficulty variable, and the rules
# allow any difficulty, so every difficulty: unrestricted below means exactly that: unknown, runner's choice.
# Our pilot runs Violent, which is strictly harder in combat, so these are a floor and not a fair target.
#
# Two times per level:
#   any_percent  - fastest known route of any kind. On 23 of 33 levels this leaves the intended path.
#   inbounds     - the board's Inbounds subcategory: the route stays inside the level. Use this one.
# Both are filtered to the Post-Revamp split, and to the Main Exit on levels that have more than one.
#
# Level 9-1 and Level 9-2 are absent: no scene bundle in this build, no leaderboard.

