# Cyber Grind, stage 1 of the curriculum: clear the first waves.
# Raise max_wave as the agent improves (then set it to 0 for full runs), and turn
# rewards.aim down to 0 once it reliably finds and shoots enemies.
env:
  mode: cybergrind
  # Speed settings (benchmarked with 5 games: 138 -> 380 steps/s):
  # 30 simulated fps with frameskip 2 keeps 15 decisions per game second, like 60 fps / frameskip 4.
  fixed_fps: 30
  frameskip: 2
  render: false      # the agent never sees pixels
  soft_death: true   # deaths end the episode with the full penalty but don't reload the scene
  window_width: 368  # 5 windows fit in one row, leaving the rest of the monitor for the dashboard
  window_height: 207
  # Episodes are a fixed two minutes of game time and continue through deaths, so the return measures
  # kills per minute. Ending episodes on death made hiding optimal: reward rose while kills/min stayed ~3.5.
  max_steps: 1800
  max_wave: 0
  end_episode_on_death: false
  hard_reset_above_wave: 5  # reload to wave 1 past this, so the agent keeps practising early waves
  rewards:
    # At 820k steps the aim reward was only 0.04 per episode: the agent almost never had an enemy near
    # the crosshair. Stronger, wider aim shaping to teach it to face enemies before fighting them.
    # Measured at 1.68M steps: firing 75% of steps but an enemy in the crosshair only 1.1% of the time.
    # It sprays and kills by accident. Strong aim shaping until on_target_frac climbs, then lower it again.
    aim: 0.15
    aim_cone_deg: 20.0
    # Rebalanced at 329k steps: with kill 2 / death 10 the agent learned to avoid fights
    # (episode length 124 -> 772 steps, kills per game-minute ~22 -> ~3). One kill now offsets a death.
    damage_dealt: 2.0
    kill: 5.0
    damage_taken: 0.02
    death: 8.0  # a cost inside the episode now, not an escape from it
    style: 0.002
    wave: 5.0

train:
  algo: ppo
  num_envs: 5  # start the games first: python scripts/games.py launch --count 5 (BepInEx supports at most 5 copies)
  run_name: cybergrind_ppo
  timesteps: 5000000
  save_every: 50000
  hyperparams:
    ent_coef: 0.005  # 0.01 kept actions too noisy for precise aiming
